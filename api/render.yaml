# Render blueprint for the API.
#
# No persistent disk, and no paid plan needed: state lives in a hosted libSQL
# (Turso) database reached over the network, so the filesystem is irrelevant and
# the free instance type is enough. An earlier version of this file mounted a
# disk because the database was a local SQLite file; swapping the driver removed
# that requirement entirely.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Then set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in the dashboard (both are
# marked sync: false so they are never committed), and set CORS_ORIGIN to the
# deployed frontend's origin.

services:
  - type: web
    name: invoice-approval-desk-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set in the Render dashboard. Never committed.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # The frontend's origin, once it is deployed. Unset allows any origin,
      # which is fine locally and not in production.
      - key: CORS_ORIGIN
        sync: false
